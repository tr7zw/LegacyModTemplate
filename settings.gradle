import groovy.json.JsonSlurper

pluginManagement {
    repositories {
		maven {
            name = "tr7zw-proxy"
            url "https://maven.tr7zw.dev/repository/maven-public/"
        }
        maven {
            // RetroFuturaGradle's plugin marker is published here, not (reliably) on the Gradle Plugin Portal.
            name = "GTNH Maven"
            url = "https://nexus.gtnewhorizons.com/repository/public/"
            mavenContent {
                includeGroup("com.gtnewhorizons")
                includeGroupByRegex("com\\.gtnewhorizons\\..+")
            }
        }
        gradlePluginPortal()
    }
}


plugins {
    id("dev.kikugie.stonecutter") version "${stonecutter_version}"
}

stonecutter {
	kotlinController = true
    centralScript = "error.gradle"

    create(getRootProject()) {

		def settings = new JsonSlurper().parseText(file('versions.json').text)
		for (String ver : settings.versions) {
			def scriptName = "versions/$ver/build.gradle.kts"
			version("$ver","$ver".split("-")[0]).buildscript(scriptName)
		}

		// Fixed at 1.8.9-forge
		vcsVersion = "1.8.9-forge"
    }
}

rootProject.name = "$id$"